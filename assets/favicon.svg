<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Moose Tracker logo">
  <!-- Badge -->
  <circle cx="64" cy="64" r="62" fill="#4E5D46"/>
  <circle cx="64" cy="64" r="57" fill="none" stroke="#B85446" stroke-width="3"/>
  <circle cx="64" cy="64" r="52" fill="#F5F1E8"/>

  <g stroke="#3A4636" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Antlers (palmate) - drawn behind the head -->
    <g fill="#C9A96A">
      <!-- left -->
      <ellipse cx="34" cy="40" rx="16" ry="9" transform="rotate(-22 34 40)"/>
      <circle cx="20" cy="30" r="5.5"/>
      <circle cx="30" cy="25" r="5.5"/>
      <circle cx="41" cy="27" r="5.5"/>
      <!-- right -->
      <ellipse cx="94" cy="40" rx="16" ry="9" transform="rotate(22 94 40)"/>
      <circle cx="108" cy="30" r="5.5"/>
      <circle cx="98" cy="25" r="5.5"/>
      <circle cx="87" cy="27" r="5.5"/>
    </g>

    <!-- Ears -->
    <g fill="#EFE3CB">
      <ellipse cx="42" cy="54" rx="9" ry="6.5" transform="rotate(-32 42 54)"/>
      <ellipse cx="86" cy="54" rx="9" ry="6.5" transform="rotate(32 86 54)"/>
    </g>

    <!-- Muzzle (lighter snout, behind head) -->
    <ellipse cx="64" cy="86" rx="18" ry="18" fill="#E7D5B0"/>
    <!-- Head -->
    <ellipse cx="64" cy="60" rx="24" ry="22" fill="#EFE3CB"/>
  </g>

  <!-- Nose -->
  <ellipse cx="64" cy="90" rx="11" ry="8" fill="#B85446" stroke="#3A4636" stroke-width="3"/>
  <ellipse cx="59" cy="90" rx="1.8" ry="2.6" fill="#7D3A2F"/>
  <ellipse cx="69" cy="90" rx="1.8" ry="2.6" fill="#7D3A2F"/>

  <!-- Eyes -->
  <g fill="#2C3E52">
    <ellipse cx="53" cy="58" rx="3.6" ry="4.2"/>
    <ellipse cx="75" cy="58" rx="3.6" ry="4.2"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="54.3" cy="56.6" r="1.2"/>
    <circle cx="76.3" cy="56.6" r="1.2"/>
  </g>
</svg>
