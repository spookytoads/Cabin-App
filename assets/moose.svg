<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Moose Tracker logo">
  <!-- Badge -->
  <circle cx="64" cy="64" r="62" fill="#4E5D46"/>
  <circle cx="64" cy="64" r="57" fill="none" stroke="#B85446" stroke-width="3"/>
  <circle cx="64" cy="64" r="52" fill="#F5F1E8"/>

  <g stroke="#3A2C22" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Palmate antlers (broad paddles with prongs) -->
    <g fill="#C9A96A">
      <path d="M52,46 C42,45 32,44 22,42 C16,41 11,38 8,32 L14,31 L8,22 L17,27 L15,13 L25,25 L28,12 L34,26 L39,15 L44,29 C49,33 52,39 52,46 Z"/>
      <path d="M76,46 C86,45 96,44 106,42 C112,41 117,38 120,32 L114,31 L120,22 L111,27 L113,13 L103,25 L100,12 L94,26 L89,15 L84,29 C79,33 76,39 76,46 Z"/>
    </g>

    <!-- Ears -->
    <g fill="#7A5540">
      <ellipse cx="36" cy="54" rx="9" ry="6" transform="rotate(-38 36 54)"/>
      <ellipse cx="92" cy="54" rx="9" ry="6" transform="rotate(38 92 54)"/>
    </g>

    <!-- Dewlap (bell) hanging under the chin -->
    <path d="M58,96 C56,108 56,116 60,120 C64,123 66,116 66,108 C66,102 64,98 62,96 Z" fill="#6B4A37"/>

    <!-- Long drooping muzzle -->
    <path d="M46,66 C44,84 48,102 64,104 C80,102 84,84 82,66 Z" fill="#6E4C39"/>
    <!-- Skull / forehead -->
    <ellipse cx="64" cy="58" rx="22" ry="19" fill="#7A5540"/>
  </g>

  <!-- Big dark nose pad -->
  <path d="M53,92 C53,100 75,100 75,92 C75,86 70,84 64,84 C58,84 53,86 53,92 Z" fill="#33261F" stroke="#241A15" stroke-width="1.5"/>
  <ellipse cx="59" cy="91" rx="2" ry="2.6" fill="#0F0B09"/>
  <ellipse cx="69" cy="91" rx="2" ry="2.6" fill="#0F0B09"/>

  <!-- Eyes -->
  <g fill="#2A2018">
    <ellipse cx="53" cy="56" rx="3.4" ry="4" fill="#fff"/>
    <ellipse cx="75" cy="56" rx="3.4" ry="4" fill="#fff"/>
    <circle cx="53.6" cy="56.6" r="2.3"/>
    <circle cx="74.4" cy="56.6" r="2.3"/>
  </g>
</svg>
